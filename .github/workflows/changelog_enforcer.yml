name: Changelog check

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    branches: [main]

permissions:
  contents: read

jobs:
  changelog:
    runs-on: ubuntu-latest
    # Escape hatch: add the "skip-changelog" label to bypass
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip-changelog') }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check CHANGELOG.rst was updated
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --name-only "$BASE_SHA...$HEAD_SHA" | grep -qx 'CHANGELOG.rst'; then
            echo "CHANGELOG.rst was updated."
          else
            echo "::error file=CHANGELOG.rst::Please update CHANGELOG.rst, or add the 'skip-changelog' label if no entry is needed."
            exit 1
          fi
