# This workflow will install the package and dependencies, run tests and lint with a single version of Python

name: Python package build and test

permissions:
  contents: read

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  schedule:
    - cron: '30 7 * * 1' # monday morning
  workflow_dispatch:

# Only one run per workflow and branch/PR at a time. A new push to the same ref
# cancels the run still in progress, except on main, where every run finishes
# so each merged commit gets a full result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: "ubuntu-latest"
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        resolution: ["highest"]
        include:
          - python-version: "3.11"
            resolution: "lowest-direct"

    steps:

      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          version-file: pyproject.toml
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install dependencies
        run: |
          uv venv
          uv pip install . --resolution ${{ matrix.resolution }}
          uv pip install --group test
      - name: Test with pytest
        run: uv run --no-sync pytest . --ignore=tests/benchmarks --cov=tubular/ --cov-report=term-missing --cov-report=xml --cov-config=.coveragerc

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11' && matrix.resolution == 'highest'
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  benchmark:
    # Gates PRs on speed: runs the PR's benchmarks against the base branch's
    # code and then the PR's code, on the same runner in the same job, and
    # fails if any benchmark's median slows down by more than the threshold.
    if: github.event_name == 'pull_request'
    runs-on: "ubuntu-latest"
    timeout-minutes: 20
    env:
      # mean/med are quite influenced by noise
      # when we are testing many transformers we will almost
      # certainly get noisy failures
      # instead fail based on min, which will
      # be harder to trigger
      BENCHMARK_THRESHOLD: "min:5%"
      VENV_PYTHON: ${{ github.workspace }}/.venv/bin/python
      BENCH_STORAGE: file://${{ github.workspace }}/.benchmarks

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          version-file: pyproject.toml
          python-version: "3.11"
          enable-cache: true
      - name: Install dependencies
        run: |
          uv venv
          uv pip install .
          uv pip install --group benchmark

      - name: Benchmark base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # checkout main
          git worktree add ../base "$BASE_SHA"
          # copy latest benchmark tests over
          cp -r tests/benchmarks ../base/tests/
          cd ../base
          # print versions for log
          PYTHONPATH="$PWD" "$VENV_PYTHON" -c "import tubular; print(tubular.__file__)"
          # run benchmarks on main and store
          PYTHONPATH="$PWD" "$VENV_PYTHON" -m pytest tests/benchmarks --benchmark-only \
            --benchmark-storage="$BENCH_STORAGE" --benchmark-save=base \
            -p no:cacheprovider

      - name: Benchmark PR and compare to base
        run: |
          PYTHONPATH="$PWD" "$VENV_PYTHON" -m pytest tests/benchmarks --benchmark-only \
            --benchmark-storage="$BENCH_STORAGE" \
            --benchmark-compare=0001 \
            --benchmark-compare-fail="$BENCHMARK_THRESHOLD" \
            --benchmark-columns=min,median,rounds \
            --benchmark-group-by=fullname \
            --benchmark-sort=name \
            -q

  feature_table:
    runs-on: "ubuntu-latest"
    timeout-minutes: 10

    steps:

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: 3.11
          version-file: pyproject.toml
          enable-cache: true
      - name: Install dependencies
        run: |
          uv venv
          uv pip install .
          uv pip install --group feature_table

      - name: Update feature table
        run: |
          uv run utils/feature_table.py

      - name: Fail if update feature table produced changes
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
          echo "Changes detected: "
          git status --porcelain
          echo "README.md may be out of date, run script feature_table.py and commit the results (or enable pre-commit to do this automatically)"
          git --no-pager diff README.md
          exit 1
          fi

  lint:
    runs-on: "ubuntu-latest"
    timeout-minutes: 10

    steps:
        - uses: actions/checkout@v7
          with:
            persist-credentials: false

        - uses: astral-sh/setup-uv@v10.4.0
          with:
            python-version: 3.11
            version-file: pyproject.toml
            enable-cache: true

        - name: Install linters
          run: uv venv && uv pip install --group lint

        - name: Ruff
          run: uv run --no-sync ruff check --output-format github .

        - name: Ruff format
          if: ${{ !cancelled() }}
          run: uv run --no-sync ruff format --check --diff .

        - name: codespell
          if: ${{ !cancelled() }}
          run: uv run --no-sync codespell .

        - name: typos
          if: ${{ !cancelled() }}
          run: uv run --no-sync typos .

        - name: Lint code examples in docs
          if: ${{ !cancelled() }}
          run: uv run --no-sync prek run blacken-docs --all-files

        - name: Check uv.lock is up to date
          if: ${{ !cancelled() }}
          run: uv lock --check
