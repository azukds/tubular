# This workflow will install the package and dependencies, run tests and lint with a single version of Python

name: Python package build and test

permissions:
  contents: read

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  schedule:
    - cron: '30 7 * * 1' # monday morning
  workflow_dispatch:

# Only one run per workflow and branch/PR at a time. A new push to the same ref
# cancels the run still in progress, except on main, where every run finishes
# so each merged commit gets a full result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: "ubuntu-22.04"
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        resolution: ["highest"]
        include:
          - python-version: "3.11"
            resolution: "lowest-direct"

    steps:

      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v9
        with:
          version-file: pyproject.toml
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install dependencies
        run: |
          uv venv
          uv pip install . --resolution ${{ matrix.resolution }}
          uv pip install --group test
      - name: Test with pytest
        run: uv run --no-sync pytest . --cov=tubular/ --cov-report=term-missing --cov-report=xml --cov-config=.coveragerc


  feature_table:
    runs-on: "ubuntu-22.04"
    timeout-minutes: 10

    steps:

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v9
        with:
          python-version: 3.11
          version-file: pyproject.toml
          enable-cache: true
      - name: Install dependencies
        run: |
          uv venv
          uv pip install .
          uv pip install --group feature_table

      - name: Update feature table
        run: |
          uv run utils/feature_table.py

      - name: Fail if update feature table produced changes
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
          echo "Changes detected: "
          git status --porcelain
          echo "README.md may be out of date, run script feature_table.py and commit the results (or enable pre-commit to do this automatically)"
          git --no-pager diff README.md
          exit 1
          fi

  lint:
    runs-on: "ubuntu-22.04"
    timeout-minutes: 10

    steps:
        - uses: actions/checkout@v7
          with:
            persist-credentials: false

        - uses: astral-sh/setup-uv@v9
          with:
            python-version: 3.11
            version-file: pyproject.toml
            enable-cache: true

        - name: Install linters
          run: uv venv && uv pip install --group lint

        - name: Ruff
          run: uv run --no-sync ruff check --output-format github .

        - name: Ruff format
          if: ${{ !cancelled() }}
          run: uv run --no-sync ruff format --check --diff .

        - name: codespell
          if: ${{ !cancelled() }}
          run: uv run --no-sync codespell .

        - name: typos
          if: ${{ !cancelled() }}
          run: uv run --no-sync typos .

        - name: Lint code examples in docs
          if: ${{ !cancelled() }}
          run: uv run --no-sync prek run blacken-docs --all-files

        - name: Check uv.lock is up to date
          if: ${{ !cancelled() }}
          run: uv lock --check
